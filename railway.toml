# Railway 部署配置（https://docs.railway.com/reference/config-as-code）
#
# 构建走仓库根目录的 Dockerfile；运行时行为几乎全靠环境变量，避免把密钥写进镜像。
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# 监听端口由 Railway 注入的 PORT 决定，程序自动读取（WB2A_LISTEN 可显式覆盖）。
# 不挂载 config.json：镜像内无此文件，首次启动自动生成（随机 api_key，0600）。
# 因此用环境变量配置网关密钥，重启/重新部署后 key 保持恒定。
startCommand = "/app/wb2api -config /app/config.json"
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
